<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HypeBot — Hook + Slo-Mo</title>
  <style>
    :root {
      --bg:      #0e0e0e;
      --surface: #1a1a1a;
      --border:  #2e2e2e;
      --fg:      #f0f0f0;
      --muted:   #666;
      --accent:  #e8ff00;
      --red:     #ff3b3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: 'Arial', sans-serif; font-size: 13px; padding: 32px 24px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .back { color: var(--muted); font-size: 11px; margin-bottom: 28px; display: block; text-decoration: none; }
    .back:hover { color: var(--fg); }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 14px; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      padding: 8px 10px; font-size: 13px; border-radius: 2px; width: 100%;
      outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--bg); }
    .field.narrow { max-width: 120px; }

    .preview-wrap { margin-top: 14px; display: none; }
    .preview-wrap video { width: 100%; max-width: 200px; border-radius: 2px; border: 1px solid var(--border); display: block; }

    .render-btn {
      background: var(--accent); color: #000; border: none; padding: 12px 32px;
      font-size: 13px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; width: 100%; margin-top: 8px;
    }
    .render-btn:hover { background: #fff; }
    .render-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

    .log-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 20px 0 6px; }
    .log-box { background: #000; border: 1px solid var(--border); border-radius: 2px; padding: 12px; height: 180px; overflow-y: auto; font-size: 11px; font-family: monospace; line-height: 1.6; }
    .log-line.error { color: #ff6b6b; }
    .done-banner { background: #1a2e1a; border: 1px solid #2e4a2e; color: #7fff7f; padding: 12px 16px; border-radius: 2px; margin-top: 12px; display: none; font-size: 12px; }
    .result-wrap { margin-top: 20px; display: none; }
    .result-wrap .result-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .result-wrap video { width: 100%; max-width: 360px; border-radius: 2px; border: 1px solid var(--border); display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>Hook + Slo-Mo</h1>
  <a class="back" href="/">← Back to HypeBot</a>

  <div class="section">
    <div class="section-title">Session &amp; Clip</div>
    <div class="row">
      <div class="field">
        <label>Session</label>
        <select id="sessionSel" onchange="onSessionChange()">
          <option value="">— select session —</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Clip</label>
        <select id="clipSel" onchange="onClipChange()">
          <option value="">— select clip —</option>
        </select>
      </div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <video id="previewVideo" controls preload="none"></video>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Settings</div>
    <div class="row">
      <div class="field">
        <label>Top bar text (full clip)</label>
        <input id="aboveText" type="text" value="Full Clip!" placeholder="e.g. Full Clip!">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Top bar text (after transition — replay)</label>
        <input id="aboveText2" type="text" placeholder="e.g. WATCH AGAIN (optional)">
      </div>
    </div>
    <div class="row">
      <div class="field narrow">
        <label>Hook duration (s)</label>
        <input id="hookOffset" type="number" value="4" min="0.5" max="15" step="0.5">
      </div>
      <div class="field narrow">
        <label>Slo-mo speed</label>
        <input id="slowmoFactor" type="number" value="0.5" min="0.1" max="0.9" step="0.05">
      </div>
    </div>
    <div class="row" style="align-items:flex-end; gap:8px; flex-wrap:nowrap;">
      <div class="field narrow">
        <label>Slow zone — from (s)</label>
        <input id="slowmoStart" type="number" value="0" min="0" max="15" step="0.1">
      </div>
      <div class="field narrow">
        <label>to (s)</label>
        <input id="slowmoEnd" type="number" value="4" min="0.1" max="15" step="0.1">
      </div>
      <span style="font-size:11px;color:var(--muted);padding-bottom:10px;">within replay</span>
    </div>
    <div class="row">
      <div class="field">
        <label>Transition (between full clip and slow-mo)</label>
        <select id="transitionSel">
          <option value="cut">Cut (instant)</option>
          <option value="flash">Flash to White</option>
          <option value="fade">Fade to Black</option>
          <option value="crossfade">Crossfade (dissolve)</option>
          <option value="radial">Clock Wipe</option>
          <option value="zoomin">Zoom + Fade</option>
          <option value="pixelize">Pixelize</option>
          <option value="slideleft">Slide</option>
          <option value="squeezeh">Squeeze</option>
        </select>
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;">
        <input type="checkbox" id="useZoom" style="accent-color:var(--accent);width:14px;height:14px;">
        Zoom in 1.5×
      </label>
    </div>
  </div>

  <button class="render-btn" id="renderBtn" onclick="startRender()">RENDER HOOK + SLO-MO</button>

  <div class="log-label">Log</div>
  <div class="log-box" id="logBox"></div>
  <div class="done-banner" id="doneBanner">✅ &nbsp; Hook + slo-mo complete</div>

  <div class="result-wrap" id="resultWrap">
    <div class="result-label">Result</div>
    <video id="resultVideo" controls preload="auto"></video>
  </div>

  <script>
    let evtSource   = null;
    let sessionClips = [];

    async function loadSessions() {
      const res  = await fetch('/clips-list');
      const data = await res.json();
      const sel  = document.getElementById('sessionSel');
      (data.sessions || []).forEach(s => {
        const o = document.createElement('option');
        o.value = s.title;
        o.textContent = s.title;
        sel.appendChild(o);
      });
    }

    function onSessionChange() {
      const session = document.getElementById('sessionSel').value;
      sessionClips = [];
      const clipSel = document.getElementById('clipSel');
      clipSel.innerHTML = '<option value="">— select clip —</option>';
      document.getElementById('previewWrap').style.display = 'none';
      if (!session) return;

      fetch('/clips-list').then(r => r.json()).then(data => {
        const s = (data.sessions || []).find(s => s.title === session);
        sessionClips = s ? s.clips : [];
        sessionClips.forEach(c => {
          const fname = c.vertical.split('/').pop();
          const o = document.createElement('option');
          o.value = fname;
          o.textContent = c.name;
          clipSel.appendChild(o);
        });
      });
    }

    function onClipChange() {
      const session  = document.getElementById('sessionSel').value;
      const filename = document.getElementById('clipSel').value;
      const wrap     = document.getElementById('previewWrap');
      const video    = document.getElementById('previewVideo');
      if (!session || !filename) { wrap.style.display = 'none'; return; }
      video.src = `/clips-serve/${encodeURIComponent(session)}/vertical/${encodeURIComponent(filename)}`;
      video.load();
      wrap.style.display = 'block';
    }

    function startRender() {
      const session  = document.getElementById('sessionSel').value;
      const filename = document.getElementById('clipSel').value;
      if (!session || !filename) { alert('Select a session and clip first.'); return; }

      const clipRel = `${session}/vertical/${filename}`;

      document.getElementById('renderBtn').disabled = true;
      document.getElementById('doneBanner').style.display  = 'none';
      document.getElementById('resultWrap').style.display  = 'none';
      document.getElementById('logBox').innerHTML = '';

      fetch('/run-hook-slowmo', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          clip:          clipRel,
          above_text:    document.getElementById('aboveText').value.trim(),
          above_text_2:  document.getElementById('aboveText2').value.trim(),
          hook_offset:   parseFloat(document.getElementById('hookOffset').value)    || 4.0,
          slowmo_factor: parseFloat(document.getElementById('slowmoFactor').value)  || 0.5,
          slowmo_start:  parseFloat(document.getElementById('slowmoStart').value)   || 0.0,
          slowmo_end:    parseFloat(document.getElementById('slowmoEnd').value)      || 4.0,
          transition:    document.getElementById('transitionSel').value,
          zoom:          document.getElementById('useZoom').checked,
        }),
      });

      if (evtSource) evtSource.close();
      evtSource = new EventSource('/logs');
      evtSource.onmessage = e => {
        const msg = e.data;
        if (msg === '__keepalive__') return;

        if (msg.startsWith('__hookslomo_done__:')) {
          const rel = msg.split(':').slice(1).join(':');
          evtSource.close();
          document.getElementById('renderBtn').disabled = false;
          document.getElementById('doneBanner').style.display = 'block';
          const wrap  = document.getElementById('resultWrap');
          const video = document.getElementById('resultVideo');
          video.src = `/clips-serve/${rel.split('/').map(encodeURIComponent).join('/')}?t=${Date.now()}`;
          video.load();
          wrap.style.display = 'block';
          return;
        }
        if (msg === '__hookslomo_failed__') {
          evtSource.close();
          document.getElementById('renderBtn').disabled = false;
          return;
        }

        const logBox = document.getElementById('logBox');
        const line   = document.createElement('span');
        line.className = 'log-line' + (msg.includes('❌') || msg.includes('⚠️') ? ' error' : '');
        line.textContent = msg;
        logBox.appendChild(line);
        logBox.appendChild(document.createElement('br'));
        logBox.scrollTop = logBox.scrollHeight;
      };
    }

    loadSessions();
  </script>
</body>
</html>
