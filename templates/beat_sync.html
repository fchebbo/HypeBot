<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HypeBot — Beat Sync</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root {
      --bg:      #0e0e0e;
      --surface: #1a1a1a;
      --border:  #2e2e2e;
      --fg:      #f0f0f0;
      --muted:   #666;
      --accent:  #e8ff00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: Arial, sans-serif; font-size: 13px; padding: 32px 24px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .back { color: var(--muted); font-size: 11px; margin-bottom: 28px; display: block; text-decoration: none; }
    .back:hover { color: var(--fg); }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 14px; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
    .row:last-child { margin-bottom: 0; }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 80px; }
    .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border); color: var(--fg);
      padding: 8px 10px; font-size: 13px; border-radius: 2px; width: 100%; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--bg); }
    .field.narrow { max-width: 110px; }
    .timestamps { display: flex; gap: 8px; flex-wrap: wrap; }
    .timestamps input { flex: 1; min-width: 80px; }
    .render-btn {
      background: var(--accent); color: #000; border: none; padding: 12px 32px;
      font-size: 13px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; width: 100%; margin-top: 8px;
    }
    .render-btn:hover { background: #fff; }
    .render-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .log-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 20px 0 6px; }
    .log-box { background: #000; border: 1px solid var(--border); border-radius: 2px; padding: 12px; height: 160px; overflow-y: auto; font-size: 11px; font-family: monospace; line-height: 1.6; }
    .log-line.error { color: #ff6b6b; }
    .done-banner { background: #1a2e1a; border: 1px solid #2e4a2e; color: #7fff7f; padding: 12px 16px; border-radius: 2px; margin-top: 12px; display: none; font-size: 12px; }
    .result-wrap { margin-top: 20px; display: none; }
    .result-wrap .result-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .result-wrap video { max-height: 600px; display: block; margin: 0 auto; border-radius: 2px; border: 1px solid var(--border); }
    .info { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
    .info span { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Beat Sync</h1>
  <a class="back" href="/">← Back to HypeBot</a>

  <!-- Clip -->
  <div class="section">
    <div class="section-title">Clip</div>
    <div class="row">
      <div class="field">
        <label>Session</label>
        <select id="sessionSel" onchange="onSessionChange()">
          <option value="">— select session —</option>
        </select>
      </div>
      <div class="field">
        <label>Clip (original/)</label>
        <select id="clipSel">
          <option value="">— select clip —</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Audio file (props/music/)</label>
        <select id="audioSel">
          <option value="">— select audio —</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Timestamps -->
  <div class="section">
    <div class="section-title">Timestamps</div>
    <div class="row">
      <div class="field narrow">
        <label>Hit 1 in clip (s)</label>
        <input id="hit1" type="number" step="0.01" value="8.05" oninput="recalc()">
      </div>
      <div class="field" style="padding-top:20px;">
        <div class="info" id="calcInfo"></div>
      </div>
    </div>
  </div>

  <!-- Effect -->
  <div class="section">
    <div class="section-title">Effect</div>
    <div class="row">
      <div class="field">
        <label>On-hit effect</label>
        <select id="effectSel">
          <option value="none">None (clean cut)</option>
          <option value="flash">Flash (white brightness burst)</option>
          <option value="punch" selected>Punch (zoom in on hit)</option>
        </select>
      </div>
      <div class="field narrow">
        <label>Flash delay (s)</label>
        <input id="flashDelay" type="number" step="0.02" value="1.0" min="-0.5" max="1.5">
      </div>
    </div>
    <div class="row" style="margin-top:12px; align-items:center;">
      <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;">
        <input type="checkbox" id="blackTopBar" style="accent-color:var(--accent);width:14px;height:14px;">
        Black top &amp; bottom bars
      </label>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="field">
        <label>Top bar text</label>
        <input id="topText" type="text" placeholder="e.g. JOKER GOES OFF">
      </div>
    </div>
  </div>

  <button class="render-btn" id="renderBtn" onclick="startRender()">RENDER BEAT SYNC</button>

  <div class="log-label">Log</div>
  <div class="log-box" id="logBox"></div>
  <div class="done-banner" id="doneBanner">✅ &nbsp; Beat sync complete</div>

  <div class="result-wrap" id="resultWrap">
    <div class="result-label">Result</div>
    <video id="resultVideo" controls preload="auto"></video>
  </div>

  <script>
    let evtSource = null;

    const HIT_GAPS      = [0.510, 0.580];
    const BEAT_TIMES    = [19.305, 19.815, 20.400];
    const CLIP_DURATION = 13.0;

    function getHits() {
      const h1 = parseFloat(document.getElementById('hit1').value) || 0;
      return [h1, h1 + HIT_GAPS[0], h1 + HIT_GAPS[0] + HIT_GAPS[1]];
    }

    function recalc() {
      const hits = getHits();
      const audioStart = (BEAT_TIMES[0] - hits[0]).toFixed(3);
      const ctxAfter   = Math.max(0.5, CLIP_DURATION - hits[2]).toFixed(2);
      document.getElementById('calcInfo').innerHTML =
        `Hits: <span>${hits.map(h => h.toFixed(3)).join('s, ')}s</span><br>` +
        `Audio offset: <span>${audioStart}s</span> &nbsp;·&nbsp; After last hit: <span>${ctxAfter}s</span>`;
    }

    async function loadSessions() {
      const res  = await fetch('/sessions-with-originals');
      const data = await res.json();
      const sel  = document.getElementById('sessionSel');
      (data.sessions || []).forEach(name => {
        const o = document.createElement('option');
        o.value = name; o.textContent = name;
        if (name.includes('Dave and Busters # 94')) o.selected = true;
        sel.appendChild(o);
      });
      if (sel.value) onSessionChange();
    }

    async function loadAudio() {
      const res  = await fetch('/outro-music');
      const data = await res.json();
      const sel  = document.getElementById('audioSel');
      (data.files || []).forEach(f => {
        const o = document.createElement('option');
        o.value = f; o.textContent = f;
        if (f === 'humanity.mp4') o.selected = true;
        sel.appendChild(o);
      });
    }

    async function onSessionChange() {
      const session = document.getElementById('sessionSel').value;
      const clipSel = document.getElementById('clipSel');
      clipSel.innerHTML = '<option value="">— select clip —</option>';
      if (!session) return;
      const res  = await fetch(`/original-clips/${encodeURIComponent(session)}`);
      const data = await res.json();
      (data.clips || []).forEach(c => {
        const o = document.createElement('option');
        o.value = c.filename; o.textContent = c.name;
        if (c.filename.startsWith('clip_7_')) o.selected = true;
        clipSel.appendChild(o);
      });
    }

    function startRender() {
      const session   = document.getElementById('sessionSel').value;
      const clip      = document.getElementById('clipSel').value;
      const audio     = document.getElementById('audioSel').value;
      const hitInputs  = getHits();
      const beatInputs = BEAT_TIMES;
      const effect     = document.getElementById('effectSel').value;
      const ctxBefore  = hitInputs[0];
      const ctxAfter   = Math.max(0.5, CLIP_DURATION - hitInputs[2]);

      if (!session || !clip || !audio) { alert('Select session, clip, and audio first.'); return; }
      if (hitInputs.some(isNaN) || beatInputs.some(isNaN)) { alert('Fill in all timestamps.'); return; }

      document.getElementById('renderBtn').disabled = true;
      document.getElementById('doneBanner').style.display = 'none';
      document.getElementById('resultWrap').style.display = 'none';
      document.getElementById('logBox').innerHTML = '';

      fetch('/run-beat-sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session, clip, audio,
          hit_times:   hitInputs,
          beat_times:  beatInputs,
          effect,
          flash_delay:   parseFloat(document.getElementById('flashDelay').value) || 0,
          context_before: ctxBefore,
          context_after:  ctxAfter,
          black_top_bar: document.getElementById('blackTopBar').checked,
          top_text:      document.getElementById('topText').value.trim(),
        }),
      });

      if (evtSource) evtSource.close();
      evtSource = new EventSource('/logs');
      evtSource.onmessage = e => {
        const msg = e.data;
        if (msg === '__keepalive__') return;

        if (msg.startsWith('__beat_sync_done__:')) {
          const rel = msg.split(':').slice(1).join(':');
          evtSource.close();
          document.getElementById('renderBtn').disabled = false;
          document.getElementById('doneBanner').style.display = 'block';
          const video = document.getElementById('resultVideo');
          video.src = `/hype-reels-serve/${rel.split('/').map(encodeURIComponent).join('/')}?t=${Date.now()}`;
          video.load();
          document.getElementById('resultWrap').style.display = 'block';
          return;
        }
        if (msg === '__beat_sync_failed__') {
          evtSource.close();
          document.getElementById('renderBtn').disabled = false;
          return;
        }

        const logBox = document.getElementById('logBox');
        const line   = document.createElement('span');
        line.className = 'log-line' + (msg.includes('❌') || msg.includes('⚠️') ? ' error' : '');
        line.textContent = msg;
        logBox.appendChild(line);
        logBox.appendChild(document.createElement('br'));
        logBox.scrollTop = logBox.scrollHeight;
      };
    }

    loadSessions();
    loadAudio();
    recalc();
  </script>
</body>
</html>
